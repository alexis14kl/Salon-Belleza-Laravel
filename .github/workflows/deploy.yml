      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 147.93.38.64
          port: 65002
          username: u691277401
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            PROJECT=/home/u691277401/domains/alianzasagroindustriales.com/Mis_Sitios_WEB_Salon_Belleza/Mis_Sitios_WEB_Salon_Belleza
